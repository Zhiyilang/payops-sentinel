name: Airwallex Sandbox Verify

on:
  workflow_dispatch:
  push:
    paths:
      - 'airwallex_verify_standalone.py'
      - '.github/workflows/airwallex-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Diagnose connectivity (DNS + HTTPS reachability)
        run: |
          python - <<'PY'
          import socket
          try:
              print('resolve api-sandbox.airwallex.com ->', socket.gethostbyname('api-sandbox.airwallex.com'))
          except Exception as e:
              print('DNS ERROR:', repr(e))
          PY
          curl -sS -o /dev/null -w 'https_probe_http_code=%{http_code}\n' --max-time 20 https://api-sandbox.airwallex.com/ || echo "curl exit=$?"

      - name: Run Airwallex sandbox verification (CI proof of payment connectivity)
        env:
          AIRWALLEX_CLIENT_ID: ${{ secrets.AIRWALLEX_CLIENT_ID }}
          AIRWALLEX_API_KEY:  ${{ secrets.AIRWALLEX_API_KEY }}
        run: |
          if [ -z "$AIRWALLEX_CLIENT_ID" ] || [ -z "$AIRWALLEX_API_KEY" ]; then
            echo "::notice::Airwallex sandbox keys not configured in this repo yet - skipping live verification. Add AIRWALLEX_CLIENT_ID / AIRWALLEX_API_KEY as repo secrets (Settings > Secrets and variables > Actions) and re-run to turn this into a green live-proof run."
            exit 0
          fi
          python airwallex_verify_standalone.py
